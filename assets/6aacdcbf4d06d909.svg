<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 625" role="img"><style>text{font-family:"PingFang SC","Microsoft YaHei","Arial Unicode MS",sans-serif}</style><rect x="0" y="0" width="1100" height="625" rx="0" fill="#fffefa"/><text x="60" y="70" font-size="38" fill="#256054" text-anchor="start" font-weight="bold">同一段比赛，两个不同的比例</text><text x="60" y="115" font-size="25" fill="#89998d" text-anchor="start" font-weight="normal">按7.6十回合表计算；并非同一指标的高低比较</text><text x="60" y="190" font-size="30" fill="#283e38" text-anchor="start" font-weight="normal">接发回合得分率</text><text x="1010" y="190" font-size="34" fill="#256054" text-anchor="end" font-weight="bold">60%</text><rect x="60" y="215" width="950" height="62" rx="5" fill="#e7ece3"/><rect x="60" y="215" width="570.0" height="62" rx="5" fill="#256054"/><text x="60" y="315" font-size="26" fill="#283e38" text-anchor="start" font-weight="normal">赢6个／10个对方发球回合</text><text x="60" y="370" font-size="30" fill="#283e38" text-anchor="start" font-weight="normal">一攻进攻得分率</text><text x="1010" y="370" font-size="34" fill="#b18442" text-anchor="end" font-weight="bold">37.5%</text><rect x="60" y="395" width="950" height="62" rx="5" fill="#e7ece3"/><rect x="60" y="395" width="356.25" height="62" rx="5" fill="#b18442"/><text x="60" y="495" font-size="26" fill="#283e38" text-anchor="start" font-weight="normal">得3分／8次实际一攻</text><text x="60" y="570" font-size="25" fill="#283e38" text-anchor="start" font-weight="normal">完整回合可以靠后续反击赢分，也可能根本没有一攻。</text></svg>