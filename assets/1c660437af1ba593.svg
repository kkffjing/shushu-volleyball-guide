<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 570" role="img"><style>text{font-family:"PingFang SC","Microsoft YaHei","Arial Unicode MS",sans-serif}</style><rect x="0" y="0" width="1100" height="570" rx="0" fill="#fffefa"/><text x="60" y="70" font-size="38" fill="#256054" text-anchor="start" font-weight="bold">10次接发，分别发生了什么</text><text x="60" y="115" font-size="25" fill="#89998d" text-anchor="start" font-weight="normal">自编教学例子｜未知保留，不补成最低档</text><text x="60" y="196" font-size="28" fill="#283e38" text-anchor="start" font-weight="normal">正常组织</text><rect x="230" y="160" width="720" height="50" rx="5" fill="#e7ece3"/><rect x="230" y="160" width="720" height="50" rx="5" fill="#256054"/><text x="975" y="196" font-size="28" fill="#283e38" text-anchor="start" font-weight="normal">5次</text><text x="60" y="274" font-size="28" fill="#283e38" text-anchor="start" font-weight="normal">组织受限</text><rect x="230" y="238" width="720" height="50" rx="5" fill="#e7ece3"/><rect x="230" y="238" width="432" height="50" rx="5" fill="#b18442"/><text x="975" y="274" font-size="28" fill="#283e38" text-anchor="start" font-weight="normal">3次</text><text x="60" y="352" font-size="28" fill="#283e38" text-anchor="start" font-weight="normal">直接失分</text><rect x="230" y="316" width="720" height="50" rx="5" fill="#e7ece3"/><rect x="230" y="316" width="144" height="50" rx="5" fill="#c06c5e"/><text x="975" y="352" font-size="28" fill="#283e38" text-anchor="start" font-weight="normal">1次</text><text x="60" y="430" font-size="28" fill="#283e38" text-anchor="start" font-weight="normal">未知</text><rect x="230" y="394" width="720" height="50" rx="5" fill="#e7ece3"/><rect x="230" y="394" width="144" height="50" rx="5" fill="#89998d"/><text x="975" y="430" font-size="28" fill="#283e38" text-anchor="start" font-weight="normal">1次</text><text x="60" y="525" font-size="25" fill="#283e38" text-anchor="start" font-weight="normal">记录总数10次，已知9次；报比例时写清分母。</text></svg>