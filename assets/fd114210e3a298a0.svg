<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 570" role="img"><style>text{font-family:"PingFang SC","Microsoft YaHei","Arial Unicode MS",sans-serif}</style><rect x="0" y="0" width="1100" height="570" rx="0" fill="#fffefa"/><text x="60" y="70" font-size="38" fill="#256054" text-anchor="start" font-weight="bold">10分，从四个地方来</text><text x="60" y="115" font-size="24" fill="#89998d" text-anchor="start" font-weight="normal">自编教学例子｜每条长条表示本队得到的分数</text><text x="60" y="196" font-size="28" fill="#283e38" text-anchor="start" font-weight="normal">进攻</text><rect x="230" y="160" width="720" height="50" rx="5" fill="#e7ece3"/><rect x="230" y="160" width="720" height="50" rx="5" fill="#256054"/><text x="975" y="196" font-size="28" fill="#283e38" text-anchor="start" font-weight="normal">5分</text><text x="60" y="274" font-size="28" fill="#283e38" text-anchor="start" font-weight="normal">拦网</text><rect x="230" y="238" width="720" height="50" rx="5" fill="#e7ece3"/><rect x="230" y="238" width="288" height="50" rx="5" fill="#b18442"/><text x="975" y="274" font-size="28" fill="#283e38" text-anchor="start" font-weight="normal">2分</text><text x="60" y="352" font-size="28" fill="#283e38" text-anchor="start" font-weight="normal">发球</text><rect x="230" y="316" width="720" height="50" rx="5" fill="#e7ece3"/><rect x="230" y="316" width="144" height="50" rx="5" fill="#507b95"/><text x="975" y="352" font-size="28" fill="#283e38" text-anchor="start" font-weight="normal">1分</text><text x="60" y="430" font-size="28" fill="#283e38" text-anchor="start" font-weight="normal">对方失误</text><rect x="230" y="394" width="720" height="50" rx="5" fill="#e7ece3"/><rect x="230" y="394" width="288" height="50" rx="5" fill="#89998d"/><text x="975" y="430" font-size="28" fill="#283e38" text-anchor="start" font-weight="normal">2分</text><text x="60" y="525" font-size="25" fill="#283e38" text-anchor="start" font-weight="normal">5＋2＋1＋2＝10分；同一份得分来源账，每分只记一次。</text></svg>