<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 595" role="img"><style>text{font-family:"PingFang SC","Microsoft YaHei","Arial Unicode MS",sans-serif}</style><rect x="0" y="0" width="1020" height="595" rx="0" fill="#fffefa"/><text x="60" y="70" font-size="38" fill="#256054" text-anchor="start" font-weight="bold">同为4次得分，失误改变效率</text><text x="60" y="115" font-size="25" fill="#89998d" text-anchor="start" font-weight="normal">各10次进攻；失误已包含直接被拦死</text><text x="60" y="185" font-size="30" fill="#283e38" text-anchor="start" font-weight="normal">甲：得分率40%，效率30%</text><rect x="60" y="210" width="360" height="68" rx="0" fill="#256054"/><text x="240" y="255" font-size="32" fill="white" text-anchor="middle" font-weight="bold">4</text><rect x="420" y="210" width="90" height="68" rx="0" fill="#c06c5e"/><text x="465" y="255" font-size="32" fill="white" text-anchor="middle" font-weight="bold">1</text><rect x="510" y="210" width="450" height="68" rx="0" fill="#89998d"/><text x="735" y="255" font-size="32" fill="white" text-anchor="middle" font-weight="bold">5</text><text x="60" y="345" font-size="30" fill="#283e38" text-anchor="start" font-weight="normal">乙：得分率40%，效率0%</text><rect x="60" y="370" width="360" height="68" rx="0" fill="#256054"/><text x="240" y="415" font-size="32" fill="white" text-anchor="middle" font-weight="bold">4</text><rect x="420" y="370" width="360" height="68" rx="0" fill="#c06c5e"/><text x="600" y="415" font-size="32" fill="white" text-anchor="middle" font-weight="bold">4</text><rect x="780" y="370" width="180" height="68" rx="0" fill="#89998d"/><text x="870" y="415" font-size="32" fill="white" text-anchor="middle" font-weight="bold">2</text><rect x="60" y="520" width="26" height="26" rx="0" fill="#256054"/><text x="100" y="543" font-size="25" fill="#283e38" text-anchor="start" font-weight="normal">直接得分</text><rect x="370" y="520" width="26" height="26" rx="0" fill="#c06c5e"/><text x="410" y="543" font-size="25" fill="#283e38" text-anchor="start" font-weight="normal">直接丢分</text><rect x="680" y="520" width="26" height="26" rx="0" fill="#89998d"/><text x="720" y="543" font-size="25" fill="#283e38" text-anchor="start" font-weight="normal">继续比赛</text></svg>