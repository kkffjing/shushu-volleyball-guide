<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 820" role="img"><style>text{font-family:"PingFang SC","Microsoft YaHei","Arial Unicode MS",sans-serif}</style><rect x="0" y="0" width="1100" height="820" rx="0" fill="#fffefa"/><text x="60" y="65" font-size="38" fill="#256054" text-anchor="start" font-weight="bold">一次小复盘，留下四样东西</text><rect x="50" y="105" width="1000" height="145" rx="5" fill="#eef3e9"/><text x="78" y="156" font-size="34" fill="#b18442" text-anchor="start" font-weight="bold">01</text><text x="160" y="152" font-size="31" fill="#256054" text-anchor="start" font-weight="bold">记录结果</text><text x="160" y="193" font-size="25" fill="#283e38" text-anchor="start" font-weight="normal">先写实际看见的事件和次数</text><text x="160" y="229" font-size="24" fill="#89998d" text-anchor="start" font-weight="normal">例：组织受限4次，其中3次二传后排插上</text><rect x="50" y="273" width="1000" height="145" rx="5" fill="#eef3e9"/><text x="78" y="324" font-size="34" fill="#b18442" text-anchor="start" font-weight="bold">02</text><text x="160" y="320" font-size="31" fill="#256054" text-anchor="start" font-weight="bold">找回回合</text><text x="160" y="361" font-size="25" fill="#283e38" text-anchor="start" font-weight="normal">用比分或录像时间定位</text><text x="160" y="397" font-size="24" fill="#89998d" text-anchor="start" font-weight="normal">例：回看一次顺畅、一次交接停顿的处理</text><rect x="50" y="441" width="1000" height="145" rx="5" fill="#eef3e9"/><text x="78" y="492" font-size="34" fill="#b18442" text-anchor="start" font-weight="bold">03</text><text x="160" y="488" font-size="31" fill="#256054" text-anchor="start" font-weight="bold">解释条件</text><text x="160" y="529" font-size="25" fill="#283e38" text-anchor="start" font-weight="normal">比较来球、分工和动作怎样衔接</text><text x="160" y="565" font-size="24" fill="#89998d" text-anchor="start" font-weight="normal">例：是不是短球责任不清，插上路线受阻</text><rect x="50" y="609" width="1000" height="145" rx="5" fill="#eef3e9"/><text x="78" y="660" font-size="34" fill="#b18442" text-anchor="start" font-weight="bold">04</text><text x="160" y="656" font-size="31" fill="#256054" text-anchor="start" font-weight="bold">约定尝试</text><text x="160" y="697" font-size="25" fill="#283e38" text-anchor="start" font-weight="normal">确定谁做什么，下次继续看</text><text x="160" y="733" font-size="24" fill="#89998d" text-anchor="start" font-weight="normal">例：约定短球优先接者，观察交接是否顺畅</text></svg>